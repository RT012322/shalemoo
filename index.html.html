  header{
    position:sticky; top:0; z-index:5;
    padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px;
background: rgba(62, 107, 76, 0.55);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  header h1{font-size:1.25rem; margin:0; font-weight:800;}
  header p{margin:2px 0 0; font-size:.8rem; opacity:.85; font-weight:400;}
  .badge{
    background:var(--mango); color:#2A1B02; font-weight:800; font-size:.85rem;
    border-radius:999px; padding:8px 14px; white-space:nowrap;
  }
  main{max-width:640px; margin:0 auto; padding:20px 16px 140px;}
  .section-title{font-size:1rem; font-weight:800; margin:22px 4px 12px; color:var(--muted);}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .flavor{
    background: rgba(62, 107, 76, 0.55); border:1px solid var(--line); border-radius:18px;
    padding:14px; text-align:right; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
  }
  .flavor:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.08);}
  .icon-wrap{
    width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    margin-bottom:8px; flex-shrink:0;
  }
  .icon-wrap svg{width:28px; height:28px;}
  .icon-wrap.small{width:34px; height:34px; margin:0;}
  .icon-wrap.small svg{width:20px; height:20px;}
  .photo-wrap{
    width:100%; aspect-ratio:1/1; border-radius:14px; overflow:hidden; margin-bottom:8px;
  }
  .photo-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-wrap.small{width:34px; height:34px; aspect-ratio:auto; border-radius:10px; margin-bottom:0;}
  .cart-item .row{display:flex; align-items:center; gap:10px;}
  .flavor .name{font-weight:800; font-size:1.02rem;}
  .flavor .price{color:var(--muted); font-size:.85rem; margin-top:2px;}

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20;
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--bg); width:100%; max-width:640px; border-radius:22px 22px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));
    max-height:85vh; overflow-y:auto;
  }
  .sheet h2{margin:0 0 4px; font-size:1.15rem; font-weight:800;}
  .sheet .sub{color:var(--muted); font-size:.85rem; margin-bottom:16px;}
  .opt-row{margin-bottom:16px;}
  .opt-label{font-size:.85rem; color:var(--muted); font-weight:600; margin-bottom:8px;}
  .opt-choices{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    flex:1; min-width:80px; text-align:center; padding:10px 8px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--card); cursor:pointer; font-weight:700; font-size:.9rem;
  }
  .chip.active{border-color:var(--leaf); background:var(--leaf); color:#fff;}
  .qty-row{display:flex; align-items:center; justify-content:center; gap:18px; margin:6px 0 18px;}
  .qty-btn{
    width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); background:var(--card);
    font-size:1.2rem; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .qty-val{font-size:1.1rem; font-weight:800; min-width:24px; text-align:center;}
  .add-btn{
    width:100%; padding:14px; border:none; border-radius:14px; background:var(--mango);
    color:#2A1B02; font-family:inherit; font-weight:800; font-size:1rem; cursor:pointer;
  }
  .close-x{
    position:absolute; left:16px; top:16px; background:none; border:none; font-size:1.3rem;
    color:var(--muted); cursor:pointer; padding:4px;
  }
  .sheet{position:relative;}

  .cart-bar{
    position:fixed; bottom:0; inset-inline:0; z-index:10;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
    background:var(--card); border-top:1px solid var(--line);
    display:none; align-items:center; gap:12px;
    max-width:640px; margin:0 auto;
  }
  .cart-bar.show{display:flex;}
  .cart-info{flex:1;}
  .cart-info .count{font-weight:800; font-size:.95rem;}
  .cart-info .total{color:var(--muted); font-size:.82rem;}
  .send-btn{
    background:var(--leaf); color:#fff; border:none; border-radius:14px; padding:13px 20px;
    font-family:inherit; font-weight:800; font-size:.95rem; cursor:pointer; white-space:nowrap;
  }
  .cart-list{
    background:var(--card); border:1px solid var(--line); border-radius:16px; margin-top:4px;
  }
  .cart-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:12px 14px; border-bottom:1px solid var(--line);
  }
  .flavor{display:flex; flex-direction:column; align-items:stretch;}
  .cart-item:last-child{border-bottom:none;}
  .cart-item .meta{font-size:.8rem; color:var(--muted); margin-top:2px;}
  .remove-btn{background:none; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer;}
  .empty-note{color:var(--muted); font-size:.9rem; text-align:center; padding:20px 0;}
</style>
</head>
<body>

<header>
  <div>
    <h1>عصارة 🥭</h1>
    <p>اختار الصنف، وحدد المقاس والتلج</p>
  </div>
  <span class="badge">اسكرول واختار</span>
</header>

<main>
  <div class="section-title">المنيو</div>
  <div class="grid" id="flavorGrid"></div>

  <div class="section-title" id="cartTitle" style="display:none;">طلبك</div>
  <div class="cart-list" id="cartList" style="display:none;"></div>
</main>

<div class="cart-bar" id="cartBar">
  <div class="cart-info">
    <div class="count" id="cartCount">0 أصناف</div>
    <div class="total" id="cartTotal">الإجمالي: 0 جنيه</div>
  </div>
  <button class="send-btn" id="sendBtn">إرسال الطلب واتساب</button>
</div>

<div class="sheet-backdrop" id="backdrop">
  <div class="sheet">
    <button class="close-x" id="closeSheet">✕</button>
    <h2 id="sheetName">اسم الصنف</h2>
    <div class="sub" id="sheetPrice">السعر الأساسي</div>

    <div class="opt-row">
      <div class="opt-label">المقاس</div>
      <div class="opt-choices" id="sizeChoices"></div>
    </div>

    <div class="opt-row">
      <div class="opt-label">التلج</div>
      <div class="opt-choices" id="iceChoices">
        <div class="chip active" data-ice="with">بي تلج</div>
        <div class="chip" data-ice="without">من غير تلج</div>
      </div>
    </div>

    <div class="opt-row">
      <div class="opt-label">الكمية</div>
      <div class="qty-row">
        <button class="qty-btn" id="qtyMinus">−</button>
        <div class="qty-val" id="qtyVal">1</div>
        <button class="qty-btn" id="qtyPlus">+</button>
      </div>
    </div>

    <button class="add-btn" id="addToCart">إضافة للطلب</button>
  </div>
</div>

function iconHTML(id, size){
  if(PHOTOS[id]){
    const cls = size==='small' ? 'photo-wrap small' : 'photo-wrap';
    return `<span class="${cls}"><img src="${PHOTOS[id]}" alt=""></span>`;
  }
  const cls = size==='small' ? 'icon-wrap small' : 'icon-wrap';
  const bg = ICON_BG[id] || '#EEE';
  return `<span class="${cls}" style="background:${bg}">${ICONS[id]||''}</span>`;
}

let cart = [];
let current = null; // { flavor, size, ice, qty }

const grid = document.getElementById("flavorGrid");
FLAVORS.forEach(f=>{
  const div = document.createElement("div");
  div.className = "flavor";
  div.innerHTML = `${iconHTML(f.id)}<div class="name">${f.name}</div><div class="price">من ${f.base} جنيه</div>`;
  div.addEventListener("click", ()=>openSheet(f));
  grid.appendChild(div);
});

const backdrop = document.getElementById("backdrop");
const sheetName = document.getElementById("sheetName");
const sheetPrice = document.getElementById("sheetPrice");
const sizeChoices = document.getElementById("sizeChoices");
const iceChoices = document.getElementById("iceChoices");
const qtyVal = document.getElementById("qtyVal");

function openSheet(flavor){
  current = { flavor, size:"medium", ice:"with", qty:1 };
  sheetName.textContent = flavor.name;
  sheetPrice.textContent = `يبدأ من ${flavor.base} جنيه`;
  sizeChoices.innerHTML = Object.keys(flavor.sizeDelta).map(s=>
    `<div class="chip ${s==='medium'?'active':''}" data-size="${s}">${SIZE_LABELS[s]} ${flavor.sizeDelta[s]>0?'(+'+flavor.sizeDelta[s]+')':''}</div>`
  ).join("");
  [...iceChoices.children].forEach(c=>c.classList.toggle("active", c.dataset.ice==="with"));
  qtyVal.textContent = "1";
  backdrop.classList.add("open");
}
function closeSheet(){ backdrop.classList.remove("open"); current=null; }
document.getElementById("closeSheet").addEventListener("click", closeSheet);
backdrop.addEventListener("click", e=>{ if(e.target===backdrop) closeSheet(); });

sizeChoices.addEventListener("click", e=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  [...sizeChoices.children].forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");
  current.size = chip.dataset.size;
});
iceChoices.addEventListener("click", e=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  [...iceChoices.children].forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");
  current.ice = chip.dataset.ice;
});
document.getElementById("qtyMinus").addEventListener("click", ()=>{
  current.qty = Math.max(1, current.qty-1); qtyVal.textContent = current.qty;
});
document.getElementById("qtyPlus").addEventListener("click", ()=>{
  current.qty = Math.min(20, current.qty+1); qtyVal.textContent = current.qty;
});

document.getElementById("addToCart").addEventListener("click", ()=>{
  const f = current.flavor;
  const unitPrice = f.base + f.sizeDelta[current.size];
  cart.push({
    name:f.name, id:f.id, size:current.size, ice:current.ice,
    qty:current.qty, unitPrice, lineTotal: unitPrice*current.qty
  });
  renderCart();
  closeSheet();
});

const cartList = document.getElementById("cartList");
const cartTitle = document.getElementById("cartTitle");
const cartBar = document.getElementById("cartBar");
const cartCount = document.getElementById("cartCount");
const cartTotal = document.getElementById("cartTotal");

function renderCart(){
  if(cart.length===0){
    cartList.style.display="none"; cartTitle.style.display="none"; cartBar.classList.remove("show");
    return;
  }
  cartTitle.style.display="block"; cartList.style.display="block"; cartBar.classList.add("show");
  cartList.innerHTML = cart.map((item,i)=>`
    <div class="cart-item">
      <div class="row">
        ${iconHTML(item.id, 'small')}
        <div>
          <div>${item.name} × ${item.qty}</div>
          <div class="meta">${SIZE_LABELS[item.size]} · ${item.ice==='with'?'بي تلج':'من غير تلج'} · ${item.lineTotal} جنيه</div>
        </div>
      </div>
      <button class="remove-btn" data-i="${i}">✕</button>
    </div>
  `).join("");
  const total = cart.reduce((s,i)=>s+i.lineTotal,0);
  cartCount.textContent = `${cart.length} ${cart.length===1?'صنف':'أصناف'}`;
  cartTotal.textContent = `الإجمالي: ${total} جنيه`;
}
cartList.addEventListener("click", e=>{
  const btn = e.target.closest(".remove-btn"); if(!btn) return;
  cart.splice(Number(btn.dataset.i),1);
  renderCart();
});

document.getElementById("sendBtn").addEventListener("click", ()=>{
  if(cart.length===0) return;
  const lines = cart.map(i=>`- ${i.name} (${SIZE_LABELS[i.size]}, ${i.ice==='with'?'بي تلج':'من غير تلج'}) × ${i.qty} = ${i.lineTotal} جنيه`);
  const total = cart.reduce((s,i)=>s+i.lineTotal,0);
  const message = `طلب جديد من ${SHOP_NAME}:\n\n${lines.join("\n")}\n\nالإجمالي: ${total} جنيه`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");
});
</script>
